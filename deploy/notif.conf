# Drop-in installe dans /etc/systemd/system/<unite>.service.d/notif.conf pour chaque unite
# beta-* (et ds1-*) : une unite en "failed" envoie une alerte Discord (salon BETA pour beta-*).
# Le template notif-echec@.service et son script vivent hors depot, avec le skill notif du VPS
# (/root/.claude/skills/notif/echec.py) : le webhook ne doit jamais entrer dans un depot.
# Sorties 4/5 des suivis et du paper = ALARME dry-run ; le reste = panne.
[Unit]
OnFailure=notif-echec@%n.service
