[project]
name = "beta"
version = "0.1.0"
description = "Banc d'essai d'edges : lake de donnees, backtests, batterie statistique"
requires-python = ">=3.12"
dependencies = ["pandas", "numpy", "scipy", "pyarrow", "duckdb"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
